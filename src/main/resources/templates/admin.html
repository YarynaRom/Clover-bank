<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CloverBank - Панель адміністратора</title>
    <link rel="icon" type="image/png" href="/images/clover-logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        /* Рожева кнопка */
        .btn-pink {
            background-color: #DB7093;
            border-color: #DB7093;
            color: white;
            transition: all 0.3s;
        }
        .btn-pink:hover {
            background-color: #c45b7e;
            border-color: #c45b7e;
            color: white;
            transform: translateY(-2px);
        }
        body { background-color: var(--bank-bg); }
        .sidebar { background-color: var(--bank-olive); color: white; min-height: 100vh; box-shadow: 4px 0 15px rgba(0,0,0,0.1); }
        .sidebar-btn { background-color: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; transition: all 0.3s; }
        .sidebar-btn:hover { background-color: rgba(255,255,255,0.1); color: white; border-color: white; }
        .table-card { background: white; border-radius: 16px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06); overflow: hidden; }
        .table thead th { background-color: var(--bank-olive-light); color: white; border-bottom: none; padding: 15px; font-weight: 600; }
        .table tbody td { padding: 15px; vertical-align: middle; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .search-panel { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="d-flex">
    <div class="sidebar p-4 d-flex flex-column" style="width: 300px;">
        <h3 class="mb-5 fw-bold text-white"><svg fill="white" height="34" width="34" class="me-2" version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512.002 512.002" xml:space="preserve">
        <g><path d="M491.917,312.599c-17.144-17.143-38.916-31.057-64.722-41.404h-134.55l95.513,95.513l-21.466,21.466l-95.513-95.513 v134.55c10.347,25.805,24.261,47.578,41.405,64.721c13.377,13.377,30.955,20.066,48.527,20.068 c17.576,0.001,35.146-6.688,48.527-20.068c12.625-12.625,19.751-29.425,20.067-47.304l0.259-14.65l14.65-0.259 c17.88-0.317,34.68-7.443,47.305-20.068C518.675,382.894,518.675,339.356,491.917,312.599z"/></g>
        <g><path d="M145.309,388.174l-21.466-21.466l95.513-95.513H84.806c-25.805,10.347-47.578,24.261-64.721,41.405 c-26.757,26.757-26.757,70.295,0,97.053c12.625,12.625,29.425,19.751,47.304,20.067l14.65,0.259l0.259,14.65 c0.317,17.88,7.443,34.68,20.068,47.305c26.756,26.756,70.294,26.757,97.053,0c17.142-17.146,31.056-38.917,41.403-64.724v-134.55 L145.309,388.174z"/></g>
        <g><path d="M491.917,102.379c-12.625-12.625-29.425-19.751-47.304-20.067l-14.65-0.259l-0.259-14.65 c-0.317-17.88-7.443-34.68-20.067-47.304C396.675,7.139,379.441,0,361.11,0c-18.331,0-35.564,7.138-48.527,20.1 c-17.143,17.144-31.057,38.915-41.404,64.721v134.551l95.513-95.513l21.466,21.466l-95.513,95.513h134.55 c25.805-10.347,47.578-24.261,64.721-41.405C518.675,172.675,518.675,129.137,491.917,102.379z"/></g>
        <g><path d="M240.822,219.371V84.821c-10.347-25.805-24.261-47.578-41.405-64.72C186.041,6.724,168.463,0.032,150.891,0.032 c-17.576,0-35.146,6.688-48.527,20.068C89.74,32.725,82.614,49.524,82.298,67.404l-0.259,14.65l-14.65,0.259 c-17.88,0.317-34.68,7.443-47.305,20.068c-26.755,26.757-26.755,70.295,0.001,97.052c17.144,17.143,38.917,31.057,64.721,41.404 h134.55l-95.513-95.513l21.466-21.466L240.822,219.371z"/></g>
    </svg>
            <span class="text-white">CloverBank Admin</span></h3>
        <div class="d-grid gap-3 mb-auto">
            <button class="btn sidebar-btn text-start rounded-pill px-4 py-3 fw-semibold" onclick="generateClients(5)">
                <i class="bi bi-robot me-2 fs-5 align-middle"></i> +5 клієнтів
            </button>
            <button class="btn sidebar-btn text-start rounded-pill px-4 py-3 fw-semibold" onclick="generateClients(15)">
                <i class="bi bi-lightning-charge-fill me-2 fs-5 align-middle"></i> +15 клієнтів
            </button>
        </div>
        <button class="btn btn-pink mt-5 text-start text-white rounded-pill px-4 py-3 fw-bold shadow-sm" onclick="exitAdmin()">
            <i class="bi bi-box-arrow-left me-2 fs-5 align-middle"></i> Повернутися на табло
        </button>
    </div>

    <div class="flex-grow-1 p-5" style="height: 100vh; overflow-y: auto;">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-muted mb-0"><i class="bi bi-pc-display-horizontal me-2"></i>Робочі місця (Вікна)</h2>
            <span class="badge bg-white text-dark border px-3 py-2 rounded-pill shadow-sm"><i class="bi bi-arrow-repeat me-1"></i> Оновлюється онлайн</span>
        </div>

        <div id="adminWindows" class="row g-4 mb-5"></div>

        <h2 class="fw-bold text-muted mb-3"><i class="bi bi-journal-text me-2"></i>Журнал черги очікування</h2>

        <div class="search-panel d-flex gap-3 align-items-center">
            <div class="flex-grow-1 position-relative">
                <i class="bi bi-search position-absolute text-muted" style="top: 10px; left: 15px;"></i>
                <input type="text" id="searchInput" class="form-control rounded-pill ps-5 py-2 bg-light border-0"
                       placeholder="Пошук за ПІБ клієнта або номером талону..." onkeyup="renderTable()">
            </div>
            <div style="width: 250px;">
                <select id="serviceFilter" class="form-select rounded-pill py-2 bg-light border-0" onchange="renderTable()">
                    <option value="ALL">Всі послуги</option>
                    <option value="CASH_OPERATIONS">Касові операції</option>
                    <option value="TRANSFERS">Грошові перекази</option>
                    <option value="LOANS">Кредитування</option>
                    <option value="MORTGAGE">Іпотека</option>
                    <option value="DEPOSITS">Депозити</option>
                    <option value="BANK_CARDS">Банківські картки</option>
                    <option value="PAYMENTS">Платежі</option>
                </select>
            </div>
        </div>

        <div class="table-card mb-5">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>№ Талону</th>
                    <th>Клієнт</th>
                    <th>Запитувана послуга</th>
                    <th>Час взяття талону</th>
                </tr>
                </thead>
                <tbody id="queueTable"></tbody>
            </table>

            <div id="emptyQueueMsg" class="text-center p-5 text-muted d-none">
                <i class="bi bi-search fs-1 d-block mb-3" style="color: var(--bank-olive-light);"></i>
                <h5 class="fw-bold">Нічого не знайдено</h5>
                <p class="mb-0">За вашим запитом немає клієнтів у черзі.</p>
            </div>
        </div>
    </div>
</div>

<script>
    const serviceTranslations = {
        "CASH_OPERATIONS": "Касові операції",
        "TRANSFERS": "Грошові перекази",
        "LOANS": "Кредитування",
        "MORTGAGE": "Іпотека",
        "DEPOSITS": "Депозити",
        "BANK_CARDS": "Банківські картки",
        "PAYMENTS": "Платежі"
    };

    let currentQueueData = []; // Зберігаємо тут усі дані, щоб не робити зайвих запитів до сервера

    // Завантаження даних з сервера
    function loadJournal() {
        fetch('/api/admin/journal')
            .then(res => res.json())
            .then(data => {
                // Оновлення вікон
                const windowsDiv = document.getElementById('adminWindows');
                windowsDiv.innerHTML = '';
                data.windows.forEach(w => {
                    let isFree = w.free;
                    let borderColor = isFree ? 'border-success' : 'border-secondary';
                    let statusHtml = isFree ?
                        '<h4 class="text-success my-4 fw-bold"><i class="bi bi-check-circle me-2"></i>ВІЛЬНО</h4>' :
                        `<h1 class="my-2 fw-bold" style="color: var(--bank-olive);">${w.currentClient.ticketNumber}</h1>
                         <div class="fw-bold fs-5 text-dark">${w.currentClient.client.name}</div>
                         <div class="text-muted small mb-3">${w.currentClient.requestedService}</div>`;
                    let buttonHtml = isFree ?
                        `<button class="btn btn-outline-secondary w-100 rounded-pill" disabled>Очікування...</button>` :
                        `<button class="btn btn-olive w-100 rounded-pill shadow-sm" onclick="serveNext(${w.windowNumber})">
                            <i class="bi bi-check2-all me-1"></i> Завершити прийом
                         </button>`;

                    windowsDiv.innerHTML += `
                        <div class="col-md-4">
                            <div class="card h-100 ${borderColor} border-2" style="border-radius: 16px;">
                                <div class="card-header bg-transparent border-bottom-0 pt-3 pb-0">
                                    <h5 class="mb-0 fw-bold text-muted"><i class="bi bi-display me-2"></i>Вікно ${w.windowNumber}</h5>
                                </div>
                                <div class="card-body text-center d-flex flex-column justify-content-center">
                                    ${statusHtml}
                                </div>
                                <div class="card-footer bg-transparent border-top-0 pb-4 px-4">
                                    ${buttonHtml}
                                </div>
                            </div>
                        </div>
                    `;
                });

                // Зберігаємо чергу в глобальну змінну і викликаємо малювання таблиці
                currentQueueData = data.queue;
                renderTable();
            });
    }

    // Окрема функція для малювання таблиці (з урахуванням фільтрів)
    function renderTable() {
        const tbody = document.getElementById('queueTable');
        const emptyMsg = document.getElementById('emptyQueueMsg');

        // Читаємо, що ввів користувач у пошук і який фільтр обрав
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const filterValue = document.getElementById('serviceFilter').value;

        tbody.innerHTML = '';

        // ФІЛЬТРАЦІЯ
        let filteredData = currentQueueData.filter(t => {
            let ukrName = t.client.name.toLowerCase();
            let ticketNum = t.ticketNumber.toLowerCase();

            // Перевіряємо текст
            let matchesSearch = ukrName.includes(searchText) || ticketNum.includes(searchText);
            // Перевіряємо випадаючий список
            let matchesFilter = (filterValue === "ALL") || (t.requestedService === filterValue);

            return matchesSearch && matchesFilter;
        });

        // МАЛЮВАННЯ
        if (filteredData.length === 0) {
            emptyMsg.classList.remove('d-none');
        } else {
            emptyMsg.classList.add('d-none');

            filteredData.forEach(t => {
                let ukrService = serviceTranslations[t.requestedService] || t.requestedService;

                let timeText = "Невідомо";
                let d = t.arrivalTime || t.time || t.createdAt || t.timestamp || t.estimatedServiceTime;
                if (d) {
                    let dateObj = Array.isArray(d) ? new Date(d[0], d[1] - 1, d[2], d[3], d[4], d[5] || 0) : new Date(d);
                    timeText = dateObj.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                }

                tbody.innerHTML += `
                    <tr>
                        <td><span class="badge px-3 py-2 rounded-pill fs-6 shadow-sm" style="background-color: var(--bank-olive);">${t.ticketNumber}</span></td>
                        <td>
                            <strong class="d-block text-dark">${t.client.name}</strong>
                            <small class="text-muted"><i class="bi bi-telephone-fill me-1" style="font-size: 0.8rem;"></i>${t.client.phone}</small>
                        </td>
                        <td><span class="text-secondary fw-semibold">${ukrService}</span></td>
                        <td><span class="text-muted"><i class="bi bi-clock me-1"></i>${timeText}</span></td>
                    </tr>
                `;
            });
        }
    }

    function serveNext(windowNumber) {
        fetch('/api/serve?windowNumber=' + windowNumber, { method: 'POST' }).then(() => loadJournal());
    }

    function generateClients(count) {
        fetch('/api/admin/generate?count=' + count, { method: 'POST' }).then(() => loadJournal());
    }

    function exitAdmin() {
        fetch('/api/admin/logout', { method: 'POST' }).then(() => { window.location.href = '/'; });
    }

    setInterval(loadJournal, 2000);
    loadJournal();
</script>

</body>
</html>
